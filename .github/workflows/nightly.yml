name: nightly-scrape

# Runs every night and commits the refreshed price history back to the repo,
# so the data is versioned and public (the reproducibility that is the point).
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Real collection: restore history, scrape today's live prices, append,
      # recompute the index, and re-export the versioned CSVs.
      # NOTE: aswakassalam.com may geo/bot-block GitHub's runners; if it does,
      # nothing is added that day and the reliable collector is a local machine
      # (Task Scheduler) running this same script. It never fails the job.
      - name: Daily real scrape
        run: python scripts/run_daily.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/observations.csv data/daily/index.csv
          if git diff --staged --quiet; then
            echo "No change in the data."
          else
            git commit -m "chore: nightly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
