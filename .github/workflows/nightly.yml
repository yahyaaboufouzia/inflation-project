name: nightly-update

# Refreshes the DERIVED series (long-run index + official CPI) and re-checks the
# daily index against the committed prices. It does NOT scrape prices: Aswak
# Assalam blocks cloud IPs, so daily COLLECTION runs on a local machine
# (Task Scheduler + scripts/daily_collect.bat, which fails loudly on an empty
# day). Masking a blocked scrape as success here would silently freeze the
# series — the worst case — so we don't do it.
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # rebuild the daily index from the COMMITTED prices (no scraping)
      - name: Rebuild daily index
        run: python scripts/build_daily_index.py

      # refresh the long-run index + official CPI (FAOSTAT + World Bank reachable)
      - name: Refresh long-run index & official CPI
        run: python scripts/build_inflation_index.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indice_quotidien.csv data/serie_logement.csv data/indice_inflation.csv data/official/cpi_maroc_faostat.csv
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: nightly refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
