name: nightly-update

# Runs daily: appends today's real retail prices, rebuilds the inflation index
# (and refreshes the official World Bank CPI), and commits the data back so the
# public dashboard always reads fresh, versioned data.
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Scrape today's prices for the whole catalog -> DAILY index.
      # NOTE: Aswak Assalam may block GitHub's runners (non-Morocco IP); if so
      # this adds nothing and the reliable collector is a local machine
      # (Task Scheduler + scripts/daily_collect.bat).
      - name: Collect today's prices
        run: python scripts/collect_daily.py || echo "scrape skipped/blocked"

      - name: Rebuild daily index
        run: python scripts/build_daily_index.py || echo "no daily data yet"

      # Refresh the official series (FAOSTAT + World Bank work fine from CI).
      - name: Rebuild long-run index
        run: python scripts/build_inflation_index.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prix_actuels.csv data/indice_quotidien.csv data/indice_inflation.csv data/official/cpi_maroc_faostat.csv data/aswak_catalog.csv
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: nightly data update ($(date -u +%Y-%m-%d))"
            git push
          fi
