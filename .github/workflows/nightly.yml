name: nightly-scrape

# Runs every night and commits the refreshed index to the repo, so the price
# history is versioned and public (the reproducibility that is the whole point).
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # DEMO MODE: rebuilds the deterministic synthetic history up to today.
      # Swap this step for `inflation-scrape` (real scrapers) once the site
      # selectors in config/sites.yaml are wired up and verified.
      - name: Build history (demo)
        run: python scripts/seed_demo.py

      - name: Compute & export index
        run: inflation-index --export data/daily/index.csv

      - name: Commit refreshed index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/index.csv
          if git diff --staged --quiet; then
            echo "No change in the index."
          else
            git commit -m "chore: nightly index refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
