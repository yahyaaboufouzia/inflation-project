[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morocco-inflation-tracker"
version = "0.1.0"
description = "An independent, daily inflation index for Morocco built from online prices — inspired by MIT's Billion Prices Project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yahya Aboufouzia" }]
keywords = ["inflation", "cpi", "web-scraping", "economics", "morocco", "price-index"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
inflation-scrape = "inflation.cli:scrape"
inflation-index = "inflation.cli:build_index"

[tool.setuptools.packages.find]
include = ["inflation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
