# The basket: every product we track.
#   id       stable slug, used as primary key and never reused
#   category must match an id in weights.yaml
#   site     which scraper to use (see config/sites.yaml); "demo" = synthetic
#   url      product page to scrape (placeholder for demo products)
#   unit     normalised unit, so 5L vs 1L stay comparable
#
# The products below use site "demo" so the whole project runs out of the box.
# To track a real product: set site to a real one (e.g. jumia) and a real url.
products:
  - { id: huile-table-5l,      name: "Huile de table 5L",          category: alimentation_base, site: demo, url: "https://example.com/huile-5l",    unit: "5L" }
