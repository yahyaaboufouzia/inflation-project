# The basket: REAL products tracked on Aswak Assalam (aswakassalam.com),
# a Moroccan hypermarket chain. Each line points at a real product page; the
# price is scraped live from that URL, which is stored as the value's source.
#
#   id        stable slug, used as primary key and never reused
#   category  must match an id in weights.yaml
#   site      "aswak" -> real scraper (inflation/scrapers/aswak.py)
#   url       the real product page the price is read from (the source)
#   unit      the pack/size as sold, so comparisons stay honest
#
# Note: online availability is limited to what the store lists, so units are
# not always the household-standard 1kg (e.g. flour is sold as 10kg). Categories
# not carried online yet (hygiene, fuel, butane gas, bread staples) will be
# added later via a separate official-prices importer.
