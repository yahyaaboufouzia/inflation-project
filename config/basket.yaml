# The basket: everyday products frequently consumed by Moroccan households.
#   id       stable slug, used as primary key and never reused
#   category must match an id in weights.yaml
#   site     which scraper to use (see config/sites.yaml); "demo" = synthetic
#   url      product page to scrape (placeholder for demo products)
#   unit     normalised unit, so different pack sizes stay comparable
#
# All products use site "demo" so the project runs out of the box with
# synthetic prices. To track a real product: set site to a real one
# (e.g. jumia / marjane) and put the real product url.
products:
  # --- Céréales & féculents -------------------------------------------------
  - { id: pain-ordinaire,   name: "Pain ordinaire (khobz)",     category: cereales_feculents, site: demo, url: "https://example.com/pain",        unit: "1u" }
  - { id: farine-ble-1kg,   name: "Farine de blé 1kg",          category: cereales_feculents, site: demo, url: "https://example.com/farine",      unit: "1kg" }
  - { id: semoule-1kg,      name: "Semoule fine 1kg",           category: cereales_feculents, site: demo, url: "https://example.com/semoule",     unit: "1kg" }
  - { id: riz-1kg,          name: "Riz 1kg",                    category: cereales_feculents, site: demo, url: "https://example.com/riz",         unit: "1kg" }
  - { id: pates-500g,       name: "Pâtes (spaghetti) 500g",     category: cereales_feculents, site: demo, url: "https://example.com/pates",       unit: "500g" }

  # --- Sucre & huiles -------------------------------------------------------
