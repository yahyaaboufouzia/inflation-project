# Single source of truth for basket weights — loaded by every index script.
#
# Inspired by the HCP consumer-price basket (COICOP classification).
# Source: HCP — Indice des prix à la consommation (IPC), pondération du panier.
#   https://www.hcp.ma/Indices-des-prix-a-la-consommation-IPC_r348.html
# NOTE: the division shares below are approximate COICOP values for Morocco and
# should be refined against the exact figures in the official HCP publication.
# Weights are renormalised over whichever groups are actually covered.

# Map each scraped retail category to a CPI division. Single source of truth,
# loaded by both build_daily_index.py and the dashboard (no duplication).
division_of_category:
  patisserie: Alimentation
  boulangerie: Alimentation
  fruits-legumes: Alimentation
  boucherie-volaille: Alimentation
  charcuterie-traiteur: Alimentation
  cremerie: Alimentation
  epicerie: Alimentation
  biscuiterie-confiserie: Alimentation
  boissons: Alimentation
  beaute-hygiene: "Hygiène & entretien"
  entretien: "Hygiène & entretien"
  maison-cuisine: Équipement
  petit-electromenager: Équipement
  gros-electromenager: Équipement
  multimedia: Équipement
  # "logement" is intentionally absent: tracked as a separate noisy series.

# For the DAILY multi-division index (spans food, housing, etc.).
divisions:
  Alimentation: 0.39           # 01  produits alimentaires & boissons
  Logement: 0.13               # 04  logement, eau, énergie
  Transport: 0.11              # 07  transport (dont carburant)
  Santé: 0.08                  # 06
  Équipement: 0.04             # 05  meubles & articles de ménage
  Habillement: 0.03            # 03
  "Hygiène & entretien": 0.02  # part de 05/12

# For the FOOD-ONLY long-run index and the US validation (renormalised over
# whichever sub-categories are present).
food_subcategories:
  Céréales: 0.26
  Viandes: 0.20
  Produits animaux: 0.13       # lait, œufs
  Légumes: 0.15
  Fruits: 0.11
  Légumineuses: 0.07
  Boissons: 0.05
  Sucre: 0.03
